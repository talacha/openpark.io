{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata: { name: {{ .Release.Name }}-db }
stringData:
  DATABASE_URL: {{ required "database.url or database.existingSecret is required" .Values.database.url | quote }}
  ADMIN_DATABASE_URL: {{ required "database.adminUrl or database.existingSecret is required" .Values.database.adminUrl | quote }}
---
{{- end }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata: { name: {{ .Release.Name }}-auth }
stringData:
  JWT_SECRET: {{ required "auth.jwtSecret or auth.existingSecret is required" .Values.auth.jwtSecret | quote }}
{{- end }}
