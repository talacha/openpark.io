# Serves the PWA and proxies the API, so the browser sees one origin (no CORS, SSE works).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the API at request time (not once at startup) so a restarted or rescheduled API is found.
  # DNS_RESOLVER: 127.0.0.11 for Docker, the cluster DNS service for Kubernetes.
  resolver ${DNS_RESOLVER} valid=10s ipv6=off;
  set $upstream ${API_UPSTREAM};

  location /v1/events {
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location ~ ^/(v1/|openapi.json|healthz|metrics) {
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
  }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
