[project]
name = "openpark-alpr"
version = "0.1.0"
description = "OpenPark ALPR worker: plate detection + OCR behind HTTP, with an optional VLM fallback"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pillow>=10.4",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Default engine pair from the architecture: open-image-models detector + fast-plate-ocr.
onnx = ["fast-alpr[onnx]>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
