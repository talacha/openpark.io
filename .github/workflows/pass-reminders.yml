# Guest-pass reminders (10 h, 11 h) and overstay notices (12 h) must run every few minutes, which Vercel's Hobby plan
# cannot do (daily crons only). This calls the API's idempotent cron endpoint on a schedule instead.
# Set repository secrets: API_URL (e.g. https://api.openpark.io) and CRON_SECRET (same value as on the API project).
# GitHub schedules are best-effort (a run can start several minutes late). On Vercel Pro, use a */5 vercel.json cron instead.
name: pass-reminders
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call /v1/cron/pass-reminders
        if: env.API_URL != '' && env.CRON_SECRET != ''
        run: |
          curl --fail-with-body --silent --show-error --max-time 50 \
            -H "Authorization: Bearer $CRON_SECRET" "$API_URL/v1/cron/pass-reminders"
